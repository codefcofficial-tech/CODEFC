<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080B08">
<title>Redirecting | CODEFC</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #080B08;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

main {
  max-width: 380px;
}

.logo {
  color: #39FF14;
  font-weight: 900;
  font-size: 25px;
}

p {
  color: #9aa49a;
  line-height: 1.6;
  font-size: 14px;
}

</style>
</head>
<body>

<main>
  <div class="logo">CODEFC</div>
  <p id="message">Preparing your link...</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
(async () => {

  const message = document.getElementById("message");

  try {

    const db = window.CODEFC_DB;

    if (!db) {
      throw new Error("Service temporarily unavailable.");
    }

    const params = new URLSearchParams(location.search);
    const code = params.get("c");

    if (!code || !/^[a-zA-Z0-9_-]{1,100}$/.test(code)) {
      throw new Error("This link is invalid.");
    }

    const { data, error } = await db.rpc(
      "codefc_redirect_link",
      { p_short_code: code }
    );

    if (error) throw error;

    if (
      typeof data !== "string" ||
      !/^https?:\/\//i.test(data)
    ) {
      throw new Error("This link is unavailable or expired.");
    }

    const destination = new URL(data);

    if (!["http:", "https:"].includes(destination.protocol)) {
      throw new Error("Invalid destination.");
    }

    location.replace(destination.href);

  } catch (error) {

    console.error("CODEFC redirect error:", error);

    message.textContent =
      "This link is unavailable. Please check the link or visit CODEFC again.";

  }

})();
</script>

</body>
</html>
