
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B08">

  <title>Create Account — CODEFC</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .signup-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px;
    }

    .signup-card {
      width: 100%;
      max-width: 460px;
      padding: 35px 25px;
      background: #101510;
      border: 1px solid #263126;
      border-radius: 18px;
    }

    .signup-card h1 {
      margin: 20px 0 8px;
      font-size: 30px;
    }

    .signup-card > p {
      color: #a5afa5;
      margin-bottom: 25px;
    }

    .signup-form {
      display: grid;
      gap: 17px;
    }

    .signup-form label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .signup-form input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #303b30;
      background: #080B08;
      color: white;
      outline: none;
    }

    .signup-form input:focus {
      border-color: #39ff14;
    }

    .signup-form button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #39ff14;
      color: #080B08;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .signup-message {
      font-size: 14px;
      color: #39ff14;
      margin-top: 15px;
    }

    .signup-bottom {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    .signup-bottom a {
      color: #39ff14;
    }
  </style>
</head>

<body>

  <main class="signup-page">

    <section class="signup-card">

      <a href="index.html" class="logo">
        CODE<span>FC</span><i>.</i>
      </a>

      <h1>Create your account</h1>

      <p>
        Join CODEFC to unlock premium codes,
        access VIP and manage your purchases.
      </p>

      <form class="signup-form" id="signupForm">

        <div>
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div>
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            autocomplete="tel"
            required
          >
        </div>

        <div>
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div>
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit">
          Create Account
        </button>

        <p class="signup-message" id="signupMessage"></p>

      </form>

      <div class="signup-bottom">
        Already have an account?
        <a href="login.html">Sign In</a>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
