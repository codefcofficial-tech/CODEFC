<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B08">

  <title>Reset Password — CODEFC</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .reset-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 18px;
    }

    .reset-card {
      width: 100%;
      max-width: 440px;
      padding: 35px 25px;
      background: #101510;
      border: 1px solid #263126;
      border-radius: 18px;
    }

    .reset-card h1 {
      font-size: 29px;
      margin: 25px 0 10px;
    }

    .reset-description {
      color: #a5afa5;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .reset-form {
      display: grid;
      gap: 18px;
    }

    .reset-form label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .reset-form input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #303b30;
      background: #080B08;
      color: white;
      box-sizing: border-box;
      outline: none;
    }

    .reset-form input:focus {
      border-color: #39ff14;
    }

    .reset-form button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #39ff14;
      color: #080B08;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .reset-message {
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .reset-bottom {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
    }

    .reset-bottom a {
      color: #39ff14;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="reset-page">

    <section class="reset-card">

      <a href="index.html" class="logo">
        CODE<span>FC</span><i>.</i>
      </a>

      <h1>Reset your password</h1>

      <p class="reset-description" id="resetDescription">
        Enter your registered email address.
        We'll send you a link to recover your account.
      </p>

      <!-- REQUEST PASSWORD RESET -->

      <form class="reset-form" id="requestResetForm">

        <div>
          <label for="resetEmail">Email Address</label>

          <input
            type="email"
            id="resetEmail"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
          >
        </div>

        <button type="submit" id="requestResetButton">
          Send Reset Link
        </button>

      </form>

      <!-- CHOOSE NEW PASSWORD -->

      <form class="reset-form" id="newPasswordForm" hidden>

        <div>
          <label for="newPassword">New Password</label>

          <input
            type="password"
            id="newPassword"
            placeholder="Create a new password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div>
          <label for="confirmNewPassword">Confirm New Password</label>

          <input
            type="password"
            id="confirmNewPassword"
            placeholder="Confirm your new password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" id="savePasswordButton">
          Update Password
        </button>

      </form>

      <p
        class="reset-message"
        id="resetMessage"
      ></p>

      <div class="reset-bottom">
        Remember your password?
        <a href="login.html">Sign In</a>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

  <script>
    const db = window.CODEFC_DB;

    const requestForm =
      document.getElementById("requestResetForm");

    const newPasswordForm =
      document.getElementById("newPasswordForm");

    const message =
      document.getElementById("resetMessage");

    const description =
      document.getElementById("resetDescription");

    const requestButton =
      document.getElementById("requestResetButton");

    const saveButton =
      document.getElementById("savePasswordButton");

    let recoverySessionReady = false;

    function showMessage(text, success = false) {
      message.textContent = text;

      message.style.color = success
        ? "#39ff14"
        : "#ff7777";
    }

    
    // Detect password recovery session
    db.auth.onAuthStateChange((event, session) => {

      if (
        event === "PASSWORD_RECOVERY" ||
        (
          event === "INITIAL_SESSION" &&
          session &&
          window.location.hash.includes("type=recovery")
        )
      ) {

        recoverySessionReady = true;

        requestForm.hidden = true;
        newPasswordForm.hidden = false;

        description.textContent =
          "Create a new password for your CODEFC account.";

        showMessage(
          "Recovery link accepted. Choose your new password.",
          true
        );
      }

    });
    

    // Request password recovery
    requestForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("resetEmail")
          .value.trim();

      requestButton.disabled = true;
      requestButton.textContent = "Sending...";
      message.textContent = "";

      try {

        const { error } = await db.auth
          .resetPasswordForEmail(email, {
            redirectTo:
              window.location.origin +
              window.location.pathname
          });

        if (error) throw error;

        showMessage(
          "If your account exists, a password reset email has been requested. Check your inbox and spam folder.",
          true
        );

      } catch (error) {

        showMessage(error.message);

      } finally {

        requestButton.disabled = false;
        requestButton.textContent = "Send Reset Link";

      }

    });

  
    // Save new password
    newPasswordForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const password =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmNewPassword").value;

      if (password.length < 8) {
        showMessage("Password must contain at least 8 characters.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Updating...";
      message.textContent = "";

      try {

        const { data: sessionData, error: sessionError } =
          await db.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session || !recoverySessionReady) {
          throw new Error(
            "Your recovery session is not active. Please open a fresh recovery link."
          );
        }

        const { data, error } = await db.auth.updateUser({
          password: password
        });

        if (error) throw error;

        showMessage(
          "Password updated successfully! You can now sign in.",
          true
        );

        newPasswordForm.reset();

        saveButton.textContent = "Password Updated";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 4000);

      } catch (error) {

        showMessage(error.message);

      } finally {

        saveButton.disabled = false;

        if (saveButton.textContent !== "Password Updated") {
          saveButton.textContent = "Update Password";
        }

      }

    });
    

  </script>

</body>
</html>
