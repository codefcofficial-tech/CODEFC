<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080B08"><title>CODEFC Payments</title><style>*{box-sizing:border-box}body{margin:0;background:#080B08;color:#f5f5f5;font-family:Arial}header{padding:18px 6%;border-bottom:1px solid #263126;display:flex;justify-content:space-between}.logo{color:#39FF14;font-weight:900;font-size:22px;text-decoration:none}main{max-width:700px;margin:30px auto;padding:0 16px}.card{background:#111811;border:1px solid #263126;border-radius:13px;padding:22px;margin-bottom:16px}h1{font-size:25px}p{color:#9aa49a;font-size:13px;line-height:1.6}.price{color:#39FF14;font-size:25px;font-weight:bold}label{display:block;margin:16px 0 7px;font-size:13px}input,select{width:100%;padding:13px;background:#080B08;color:white;border:1px solid #354235;border-radius:8px}button{width:100%;padding:14px;background:#39FF14;color:#071007;border:0;border-radius:8px;font-weight:bold;margin-top:18px}button:disabled{opacity:.5}.notice{white-space:pre-wrap;background:#172217;padding:14px;border-radius:8px;font-size:13px;line-height:1.7}#message{white-space:pre-wrap;color:#39FF14;font-size:13px;margin-top:12px}.back{color:#39FF14;text-decoration:none}</style></head><body><header><a class="logo" href="index.html">CODEFC</a><a class="back" href="dashboard.html">Dashboard</a></header><main><section class="card"><h1 id="heading">Complete payment</h1><p id="intro">Transfer using the bank details below. Access remains locked until the Founder verifies payment.</p><div id="price" class="price">Loading...</div><div id="bank" class="notice">Loading bank details...</div><form id="form"><div id="codeWrap" hidden><label for="code">Choose premium code</label><select id="code" required></select></div><label for="sender">Account name used for transfer</label><input id="sender" maxlength="120" required><label for="ref">Transfer reference / narration</label><input id="ref" maxlength="120" required><button id="submit" type="submit">Submit for verification</button></form><div id="message"></div></section><section class="card"><b>Security reminder</b><p>Submitting a reference is not proof of payment. Never share your password, PIN, OTP or card details.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
(async()=>{const db=window.CODEFC_DB,$=id=>document.getElementById(id),type=new URLSearchParams(location.search).get('type')==='code'?'code':'vip',say=t=>$('message').textContent=t;if(!db){say('Payment service unavailable.');return}const {data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html');return}const user=session.user;if(type==='vip'){$('heading').textContent='CODEFC VIP Membership';$('intro').textContent='Transfer ₦15,000 for 30 days of VIP access. Membership begins only after Founder approval.';$('price').textContent='₦15,000 · 30 DAYS'}else{$('heading').textContent='Unlock an Individual Code';$('intro').textContent='Choose an active premium code and transfer ₦500. Access is granted after Founder approval.';$('price').textContent='₦500 · PER CODE';$('codeWrap').hidden=false;const {data,error}=await db.from('codes').select('id,platform,match_title,competition,expires_at,status,access_type').eq('access_type','paid').eq('status','active').order('created_at',{ascending:false});const sel=$('code');sel.add(new Option('Select a code',''));(data||[]).filter(c=>c.expires_at&&new Date(c.expires_at)>new Date()).forEach(c=>sel.add(new Option(`${c.match_title||'Match'} — ${c.platform||''} (${c.competition||''})`,c.id)));if(error||sel.options.length===1){sel.add(new Option(error?'Could not load codes':'No active paid codes available',''));$('submit').disabled=true}}const {data:bank,error}=await db.from('payment_settings').select('bank_name,account_name,account_number,instructions').limit(1).maybeSingle();if(error||!bank){$('bank').textContent='Bank transfer details are not available yet.';$('submit').disabled=true}else $('bank').textContent=[`Bank: ${bank.bank_name||'—'}`,`Account name: ${bank.account_name||'—'}`,`Account number: ${bank.account_number||'—'}`,bank.instructions||''].filter(Boolean).join('\n');$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;b.textContent='Submitting...';try{const sender=$('sender').value.trim(),ref=$('ref').value.trim();if(!sender||!ref)throw Error('Enter the sender account name and transfer reference.');if(type==='vip'){const {data:pending,error}=await db.from('vip_payment_requests').select('id').eq('user_id',user.id).eq('status','pending').limit(1);if(error)throw error;if(pending?.length)throw Error('You already have a pending VIP request.');const {error:ie}=await db.from('vip_payment_requests').insert({user_id:user.id,amount_ngn:15000,sender_name:sender,payment_reference:ref,status:'pending'});if(ie)throw ie}else{const codeId=$('code').value;if(!codeId)throw Error('Select a premium code.');const {data:old,error}=await db.from('code_purchases').select('id').eq('user_id',user.id).eq('code_id',codeId).in('status',['pending','approved']).limit(1);if(error)throw error;if(old?.length)throw Error('You already have a pending or approved purchase for this code.');const {error:ie}=await db.from('code_purchases').insert({code_id:codeId,user_id:user.id,amount_ngn:500,payment_reference:ref,status:'pending'});if(ie)throw ie}say('Request submitted. Access remains locked until the Founder confirms the transfer. Check your dashboard for updates.');$('form').reset()}catch(err){say(err.message||'Could not submit request.')}finally{b.disabled=false;b.textContent='Submit for verification'}}})();</script></body></html>
