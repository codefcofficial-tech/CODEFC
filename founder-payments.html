<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080B08"><title>Founder Payments | CODEFC</title><style>*{box-sizing:border-box}body{margin:0;background:#080B08;color:#f5f5f5;font-family:Arial}header{padding:18px 6%;border-bottom:1px solid #263126;display:flex;justify-content:space-between}.logo{color:#39FF14;font-weight:900;text-decoration:none}main{max-width:950px;margin:28px auto;padding:0 16px 40px}.card{background:#111811;border:1px solid #263126;border-radius:12px;padding:18px;margin:15px 0}.request{border-top:1px solid #293629;padding:14px 0}.request p{font-size:13px;color:#aab4aa;margin:5px 0;overflow-wrap:anywhere}.actions{display:flex;gap:9px;margin-top:10px}.actions button{padding:10px;border:0;border-radius:7px;font-weight:bold}.yes{background:#39FF14}.no{background:#392020;color:#ff9999}#status{color:#39FF14;white-space:pre-wrap}.muted{color:#9aa49a;font-size:13px}</style></head><body><header><a class="logo" href="index.html">CODEFC · FOUNDER</a><button id="logout">Log out</button></header><main><h1>Payment verification</h1><p class="muted">Verify each transfer in your bank account before approving. A submitted reference is not proof of payment.</p><div id="status"></div><section class="card"><h2>VIP requests · ₦15,000</h2><div id="vip">Loading...</div></section><section class="card"><h2>Individual code purchases · ₦500</h2><div id="codes">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
(async()=>{const db=window.CODEFC_DB,$=id=>document.getElementById(id),msg=t=>$('status').textContent=t;if(!db)return msg('Database unavailable.');const {data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html');return}const {data:p,error:pe}=await db.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(pe||p?.is_admin!==true){document.body.innerHTML='<main><h1>Access denied</h1><p>Founder administrator access is required.</p></main>';return}const fmt=v=>v?new Date(v).toLocaleString('en-NG'):'—',el=(tag,t)=>{const n=document.createElement(tag);n.textContent=t;return n};async function loadVIP(){const host=$('vip');host.replaceChildren();const {data,error}=await db.from('vip_payment_requests').select('id,user_id,amount_ngn,sender_name,payment_reference,created_at').eq('status','pending').order('created_at');if(error){host.textContent=error.message;return}if(!data?.length){host.textContent='No pending VIP requests.';return}for(const r of data){const box=document.createElement('div');box.className='request';box.append(el('b','VIP · ₦'+Number(r.amount_ngn).toLocaleString()),el('p','User: '+r.user_id),el('p','Sender: '+(r.sender_name||'—')),el('p','Reference: '+(r.payment_reference||'—')),el('p','Submitted: '+fmt(r.created_at)));const a=document.createElement('div');a.className='actions';const y=el('button','Approve & activate 30 days');y.className='yes';const n=el('button','Reject');n.className='no';y.onclick=async()=>{if(!confirm('Have you confirmed ₦15,000 in your bank account?'))return;y.disabled=true;const {error}=await db.rpc('founder_approve_vip_payment',{p_request_id:r.id});if(error){msg('Approval failed: '+error.message);y.disabled=false;return}msg('VIP payment approved and membership activated.');loadVIP()};n.onclick=async()=>{if(!confirm('Reject this VIP request?'))return;n.disabled=true;const {error}=await db.from('vip_payment_requests').update({status:'rejected'}).eq('id',r.id).eq('status','pending');if(error){msg(error.message);n.disabled=false;return}msg('VIP request rejected.');loadVIP()};a.append(y,n);box.append(a);host.append(box)}}async function loadCodes(){const host=$('codes');host.replaceChildren();const {data,error}=await db.from('code_purchases').select('id,code_id,user_id,amount_ngn,payment_reference,created_at').eq('status','pending').order('created_at');if(error){host.textContent=error.message;return}if(!data?.length){host.textContent='No pending code purchases.';return}const ids=[...new Set(data.map(x=>x.code_id))],{data:cs}=await db.from('codes').select('id,platform,match_title,competition').in('id',ids),map=new Map((cs||[]).map(c=>[c.id,c]));for(const r of data){const c=map.get(r.code_id),box=document.createElement('div');box.className='request';box.append(el('b',(c?.match_title||'Premium code')+' · ₦'+Number(r.amount_ngn).toLocaleString()),el('p','Platform: '+(c?.platform||'—')+' · '+(c?.competition||'—')),el('p','User: '+r.user_id),el('p','Reference: '+(r.payment_reference||'—')),el('p','Submitted: '+fmt(r.created_at)));const a=document.createElement('div');a.className='actions';const y=el('button','Approve access');y.className='yes';const n=el('button','Reject');n.className='no';y.onclick=async()=>{if(!confirm('Have you confirmed ₦500 in your bank account and checked the code is still active?'))return;y.disabled=true;const {error}=await db.from('code_purchases').update({status:'approved'}).eq('id',r.id).eq('status','pending');if(error){msg(error.message);y.disabled=false;return}msg('Code purchase approved.');loadCodes()};n.onclick=async()=>{if(!confirm('Reject this purchase?'))return;n.disabled=true;const {error}=await db.from('code_purchases').update({status:'rejected'}).eq('id',r.id).eq('status','pending');if(error){msg(error.message);n.disabled=false;return}msg('Purchase rejected.');loadCodes()};a.append(y,n);box.append(a);host.append(box)}}await Promise.all([loadVIP(),loadCodes()]);$('logout').onclick=async()=>{await db.auth.signOut();location.replace('index.html')}})();</script></body></html>
